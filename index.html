<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | NFT preview card component</title>
</head>

<body>
    <div class="container">
            <main>
                <div class="image-card">
                    <img src="images/image-equilibrium.jpg" style="max-width: 300px;" alt="">
                    <span class="image-overlay" aria-hidden="true">
                        <img src="images/icon-view.svg" alt="">
                    </span>
                </div>

                    <span class="text">
                        <h3>Equilibrium #3429</h3>
                        <p>Our Equilibrium collection promotes balance and calm.</p>
                        <p><img src="images/icon-ethereum.svg" alt=""> 0.041 ETH</p>
                        <p><img src="images/icon-clock.svg" alt=""> 3 days left</p>
                    </span>
                    <span class="img-p">
                        <img src="images/image-avatar.png" style="width: 30px; border-radius: 999px; border: 1px solid white;" alt="">
                        <p>Creation of
                            <mark>Jules Wyvern</mark>
                        </p>
                    </span>
            </main>
        </div>

    </div>
</body>

</html>
